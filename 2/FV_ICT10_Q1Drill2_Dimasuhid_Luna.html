<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Student Profile Form</title>
   
    <link rel="stylesheet" href="https://pyscript.net/releases/2024.1.1/core.css">
    <script type="module" src="https://pyscript.net/releases/2024.1.1/core.js"></script>
</head>
<body>
    <h2>Student Profile Form</h2>

   
    <label for="name">Name:</label>
    <input type="text" id="name"><br><br>

    <label for="age">Age:</label>
    <input type="text" id="age"><br><br>

    <label for="school">School:</label>
    <input type="text" id="school"><br><br>

  
    <button id="generate-btn" py-click="generate_message">Generate Message</button>



    <div id="output" style="margin-top:20px; padding:10px; border:1px solid black;"></div>

   
    <py-config>
        [[fetch]]
        files = ["main5.py"]
    </py-config>

    <script type="py" src="main5.py"></script>
</body>
</html>
